name: "Ring buffer start detection and fold toggle"
description: "Verify ring buffer time wraparound is detected and red flag fold cycle works"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open ring buffer test log file"
    command: "greplogviewer._testOpenFile"
    args:
      - "./autotest_workspace/ring_buffer_test.log"
    waitAfter: 1500

  - description: "Focus editor and wait for activation"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 1500

  - description: "Prime extension activation"
    command: "greplogviewer._testGetState"
    waitAfter: 1000

  - description: "Apply filter with time pattern"
    command: "greplogviewer._testGo"
    args:
      - groups:
          - id: "group-all"
            name: "All lines"
            color: "#ff0000"
            expressions:
              - id: "expr-all"
                pattern: ".*"
                flags: ""
                operator: "and"
        timePattern:
          format: "YYYY-MM-DD HH:mm:ss"
    waitAfter: 1500

  - description: "Click red flag start line (line 4) to toggle foldBelow"
    command: "autotest.setCursor"
    args:
      - line: 4
        character: 0
    waitAfter: 1000

  - description: "Check ring buffer state before asserting fold ranges"
    command: "greplogviewer._testGetRingBufferState"
    waitAfter: 500

  - description: "Verify foldBelow range is present"
    command: "greplogviewer._testGetState"
    waitAfter: 800
    assert:
      type: "return_value_contains"
      expected: '"startLine":4,"endLine":7'
      message: "foldBelow should fold lines 4-7"

  - description: "Toggle to foldAbove via command"
    command: "greplogviewer.toggleStartLineFold"
    waitAfter: 1000

  - description: "Verify foldAbove range is present"
    command: "greplogviewer._testGetState"
    waitAfter: 800
    assert:
      type: "return_value_contains"
      expected: '"startLine":0,"endLine":3'
      message: "foldAbove should fold lines 0-3"

  - description: "Toggle to none via command"
    command: "greplogviewer.toggleStartLineFold"
    waitAfter: 1000

  - description: "Verify no ring buffer fold range remains"
    command: "greplogviewer._testGetState"
    waitAfter: 800
    assert:
      type: "return_value_not_contains"
      expected: '"startLine":4,"endLine":7'
      message: "After toggling to none, foldBelow range should be gone"
