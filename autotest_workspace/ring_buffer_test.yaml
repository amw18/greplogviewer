name: "Ring buffer start detection and red flag"
description: "Verify ring buffer time wraparound is detected and marked with a red flag gutter icon"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open ring buffer test log file"
    command: "greplogviewer._testOpenFile"
    args:
      - "./ring_buffer_test.log"
    waitAfter: 1500

  - description: "Focus editor and wait for activation"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 1500

  - description: "Prime extension activation"
    command: "greplogviewer._testGetState"
    waitAfter: 1000

  - description: "Apply filter with time pattern"
    command: "greplogviewer._testGo"
    args:
      - groups:
          - id: "group-all"
            name: "All lines"
            color: "#ff0000"
            expressions:
              - id: "expr-all"
                pattern: ".*"
                flags: ""
                operator: "and"
        timePattern:
          format: "YYYY-MM-DD HH:mm:ss"
    waitAfter: 1500

  - description: "Verify ring buffer start line is detected"
    command: "greplogviewer._testGetRingBufferState"
    waitAfter: 500
    assert:
      type: "return_value_contains"
      expected: '"startLine":4'
      message: "Ring buffer start line should be detected at line 4"
