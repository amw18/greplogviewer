name: "Per-keyword goto hit navigation"
description: "Verify gotoKeywordHit navigates within a specific keyword's hits"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open test log file"
    command: "greplogviewer._testOpenFile"
    args:
      - "./test.log"
    waitAfter: 2000

  - description: "Focus editor"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 1500

  - description: "Apply filter with keyword match A"
    command: "greplogviewer._testGo"
    args:
      - groups:
          - id: "g-all"
            name: "All"
            color: "#ff0000"
            expressions:
              - id: "e-all"
                pattern: "line"
                flags: ""
                operator: "and"
        keywords:
          - id: "kw-a"
            pattern: "match A"
            flags: ""
            color: "#00ff00"
            enabled: true
            matchScope: "full"
    waitAfter: 3000

  - description: "Navigate to next kw-a hit from line 0"
    command: "greplogviewer.gotoKeywordHit"
    args:
      - direction: "next"
        keywordId: "kw-a"
    waitAfter: 1000

  - description: "Verify cursor moved to line 3 (second match A)"
    command: "greplogviewer._testGetEditorInfo"
    assert:
      type: "return_value_contains"
      expected: '"cursorLine":3'
    waitAfter: 500
