name: "Mixed kernel timestamp formats and ring-buffer detection"
description: "Verify auto-detect handles [s.SSSSSS] and [CPUx: s.SSSSSS] mixed formats, and ring-buffer start line is detected"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open mixed kernel log file"
    command: "greplogviewer._testOpenFile"
    args:
      - "./kernel_mixed_time_format_test.log"
    waitAfter: 1500

  - description: "Focus editor"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 1000

  - description: "Run Go with empty filter to trigger auto-detect and ring-buffer scan"
    command: "greplogviewer._testGo"
    args:
      - groups: []
        keywords: []
    waitAfter: 1500

  - description: "Get ring-buffer state after auto-detect"
    command: "greplogviewer._testGetRingBufferState"
    waitAfter: 500
    assert:
      type: "return_value_contains"
      expected: '"startLine":4'
      message: "Ring-buffer start line should be line 4 (timestamp 0.500000 < previous 3.000000)"
