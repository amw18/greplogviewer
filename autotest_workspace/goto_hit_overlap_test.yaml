name: "Ctrl+Up/Down keyword priority over group on overlapping hit"
description: "Verify keyword takes priority when cursor line matches both a group and a keyword"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open overlap test log file"
    command: "greplogviewer._testOpenFile"
    args:
      - "./goto_hit_overlap_test.log"
    waitAfter: 1500

  - description: "Focus editor"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 1000

  - description: "Apply filter group A + keyword B"
    command: "greplogviewer._testGo"
    args:
      - groups:
          - id: "group-a"
            name: "Group A"
            color: "#ff0000"
            expressions:
              - id: "expr-a"
                pattern: "match A"
                flags: ""
                operator: "and"
        keywords:
          - id: "kw-b"
            pattern: "match B"
            flags: ""
            color: "#00ff00"
            enabled: true
            matchScope: "full"
    waitAfter: 1500

  - description: "Set cursor to overlapping line 1"
    command: "autotest.setCursor"
    args:
      - line: 1
        character: 0
    waitAfter: 300

  - description: "Goto next hit from overlapping line should follow keyword B"
    command: "greplogviewer.gotoNextHit"
    waitAfter: 300
    assert:
      type: "return_value_contains"
      expected: '"cursorLine":2'
      message: "Keyword should take priority: from overlap line 1, next hit should be keyword B line 2"
