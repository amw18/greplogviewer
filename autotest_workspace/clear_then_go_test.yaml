name: "Clear then Go should re-filter"
description: "Verify that after Go -> Clear -> Go with the same filter, results are recomputed instead of returning empty"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open test log file"
    command: "greplogviewer._testOpenFile"
    args:
      - "./test.log"
    waitAfter: 2000

  - description: "Focus editor and wait for activation"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 2000

  - description: "Prime extension activation"
    command: "greplogviewer._testGetState"
    waitAfter: 1500

  - description: "Apply filter A (match A lines)"
    command: "greplogviewer._testGo"
    args:
      - groups:
          - id: "group-a"
            name: "Group A"
            color: "#ff0000"
            expressions:
              - id: "expr-a"
                pattern: "match A"
                flags: ""
                operator: "and"
    waitAfter: 2500

  - description: "Verify filter A produced matches"
    command: "greplogviewer._testGetState"
    assert:
      type: "return_value_contains"
      expected: '"startLine":1'
    waitAfter: 1000

  - description: "Click Clear"
    command: "greplogviewer._testClear"
    waitAfter: 2000

  - description: "Apply same filter A again (Go after Clear)"
    command: "greplogviewer._testGo"
    args:
      - groups:
          - id: "group-a"
            name: "Group A"
            color: "#ff0000"
            expressions:
              - id: "expr-a"
                pattern: "match A"
                flags: ""
                operator: "and"
    waitAfter: 2500

  - description: "Verify filter A produced matches after Clear -> Go"
    command: "greplogviewer._testGetState"
    assert:
      type: "return_value_contains"
      expected: '"startLine":1'
    waitAfter: 1000
