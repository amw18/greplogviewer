name: "Ring buffer start detection with auto-detected time format"
description: "Verify ring buffer detection works when Time Fmt is left empty and auto-detected"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open ring buffer test log file"
    command: "greplogviewer._testOpenFile"
    args:
      - "./ring_buffer_test.log"
    waitAfter: 1500

  - description: "Focus editor and wait for activation"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 1500

  - description: "Prime extension activation"
    command: "greplogviewer._testGetState"
    waitAfter: 1000

  - description: "Apply filter WITHOUT explicit time pattern"
    command: "greplogviewer._testGo"
    args:
      - groups:
          - id: "group-all"
            name: "All lines"
            color: "#ff0000"
            expressions:
              - id: "expr-all"
                pattern: ".*"
                flags: ""
                operator: "and"
    waitAfter: 1500

  - description: "Verify ring buffer start line is detected via auto-detect"
    command: "greplogviewer._testGetRingBufferState"
    waitAfter: 500
    assert:
      type: "return_value_contains"
      expected: '"startLine":4'
      message: "Auto-detected time format should reveal ring buffer start line at line 4"
