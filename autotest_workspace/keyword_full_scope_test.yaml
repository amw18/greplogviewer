name: "Keyword full scope keeps lines visible"
description: "Verify full-scope keyword matched lines are not folded and non-keyword text remains visible"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open test log file"
    command: "greplogviewer._testOpenFile"
    args:
      - "./test.log"
    waitAfter: 2000

  - description: "Focus editor"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 1500

  - description: "Apply filter with group A and full-scope keyword 'unmatched A'"
    command: "greplogviewer._testGo"
    args:
      - groups:
          - id: "group-a"
            name: "Group A"
            color: "#ff0000"
            expressions:
              - id: "expr-a"
                pattern: "match A"
                flags: ""
                operator: "and"
        keywords:
          - id: "kw-full"
            pattern: "unmatched A"
            flags: ""
            color: "#00ff00"
            enabled: true
            matchScope: "full"
    waitAfter: 2500

  - description: "Get state"
    command: "greplogviewer._testGetState"
    waitAfter: 1000

  - description: "Verify lines 0-4 are visible (keyword-only lines 1,2 not folded)"
    command: "greplogviewer._testGetVisibleRanges"
    assert:
      type: "return_value_contains"
      expected: '"line":4'
    waitAfter: 1000
