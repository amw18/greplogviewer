name: "Ctrl+Up/Down navigate between hits"
description: "Verify gotoPrevNextHit cycles through group/keyword hit lines with keyword priority"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open test log file"
    command: "greplogviewer._testOpenFile"
    args:
      - "./test.log"
    waitAfter: 1500

  - description: "Focus editor"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 1000

  - description: "Apply filter group A + keyword B"
    command: "greplogviewer._testGo"
    args:
      - groups:
          - id: "group-a"
            name: "Group A"
            color: "#ff0000"
            expressions:
              - id: "expr-a"
                pattern: "match A"
                flags: ""
                operator: "and"
        keywords:
          - id: "kw-b"
            pattern: "match B"
            flags: ""
            color: "#00ff00"
            enabled: true
            matchScope: "full"
    waitAfter: 1500

  - description: "Set cursor to group hit line 0"
    command: "autotest.setCursor"
    args:
      - line: 0
        character: 0
    waitAfter: 300

  - description: "Goto next hit from group hit should stay in group A"
    command: "greplogviewer.gotoNextHit"
    waitAfter: 300
    assert:
      type: "return_value_contains"
      expected: '"cursorLine":3'
      message: "From group hit line 0, next hit should be group A line 3"

  - description: "Set cursor to keyword hit line 4"
    command: "autotest.setCursor"
    args:
      - line: 4
        character: 0
    waitAfter: 300

  - description: "Goto next hit from keyword hit should stay in keyword B"
    command: "greplogviewer.gotoNextHit"
    waitAfter: 300
    assert:
      type: "return_value_contains"
      expected: '"cursorLine":7'
      message: "From keyword hit line 4, next hit should be keyword B line 7"

  - description: "Set cursor to non-hit line 1"
    command: "autotest.setCursor"
    args:
      - line: 1
        character: 0
    waitAfter: 300

  - description: "Goto next hit from non-hit should jump to next any hit"
    command: "greplogviewer.gotoNextHit"
    waitAfter: 300
    assert:
      type: "return_value_contains"
      expected: '"cursorLine":3'
      message: "From non-hit line 1, next hit should be line 3"

  - description: "Set cursor to first hit line 0"
    command: "autotest.setCursor"
    args:
      - line: 0
        character: 0
    waitAfter: 300

  - description: "Goto previous hit from first group hit should wrap within group A"
    command: "greplogviewer.gotoPrevHit"
    waitAfter: 300
    assert:
      type: "return_value_contains"
      expected: '"cursorLine":3'
      message: "Prev hit from first group A hit line 0 should wrap to last group A hit line 3"

  - description: "Set cursor to non-hit line after last hit"
    command: "autotest.setCursor"
    args:
      - line: 8
        character: 0
    waitAfter: 300

  - description: "Goto previous hit from after last hit should wrap to last overall hit"
    command: "greplogviewer.gotoPrevHit"
    waitAfter: 300
    assert:
      type: "return_value_contains"
      expected: '"cursorLine":7'
      message: "Prev hit from line 8 should wrap to last overall hit line 7"
