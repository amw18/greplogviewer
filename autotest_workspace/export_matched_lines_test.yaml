name: "Export matched lines to untitled editor"
description: "Verify Export Matched Lines opens a new unsaved editor with only matched lines"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open test log file"
    command: "greplogviewer._testOpenFile"
    args:
      - "./test.log"
    waitAfter: 2000

  - description: "Focus editor"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 1500

  - description: "Apply filter for match A lines"
    command: "greplogviewer._testGo"
    args:
      - groups:
          - id: "group-a"
            name: "Group A"
            color: "#ff0000"
            expressions:
              - id: "expr-a"
                pattern: "match A"
                flags: ""
                operator: "and"
    waitAfter: 3000

  - description: "Export matched lines"
    command: "greplogviewer.exportMatchedLines"
    waitAfter: 2000

  - description: "Verify new editor is untitled"
    command: "greplogviewer._testGetEditorInfo"
    assert:
      type: "return_value_contains"
      expected: '"isUntitled":true'
    waitAfter: 1000

  - description: "Verify new editor has matched lines"
    command: "greplogviewer._testGetEditorInfo"
    assert:
      type: "return_value_contains"
      expected: '"lineCount":3'
    waitAfter: 500
