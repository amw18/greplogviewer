name: "File-based config auto-discovery"
description: "Verify configs in ~/.agent/greplogviewer-configs/ appear in the saved configs list"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open test log file"
    command: "greplogviewer._testOpenFile"
    args:
      - "./test.log"
    waitAfter: 2000

  - description: "Focus editor"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 1500

  - description: "Get saved configs list"
    command: "greplogviewer._testGetSavedConfigs"
    assert:
      type: "return_value_contains"
      expected: '"name":"test-agent-config"'
    waitAfter: 1000

  - description: "Verify file scope"
    command: "greplogviewer._testGetSavedConfigs"
    assert:
      type: "return_value_contains"
      expected: '"scope":"file"'
    waitAfter: 500
