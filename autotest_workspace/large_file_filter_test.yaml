name: "Large file filter performance"
description: "Verify 100k line log can be filtered without hanging and folding is applied"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open 100k line log file"
    command: "greplogviewer._testOpenFile"
    args:
      - "./test_100k.log"
    waitAfter: 3000

  - description: "Focus editor and wait for activation"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 2000

  - description: "Prime extension activation"
    command: "greplogviewer._testGetState"
    waitAfter: 1500

  - description: "Apply filter for ERROR lines"
    command: "greplogviewer._testGo"
    args:
      - groups:
          - id: "error-group"
            name: "Errors"
            color: "#ff0000"
            expressions:
              - id: "error-expr"
                pattern: "ERROR"
                flags: ""
                operator: "and"
    waitAfter: 10000

  - description: "Get filter state"
    command: "greplogviewer._testGetState"
    waitAfter: 2000

  - description: "Get visible ranges"
    command: "greplogviewer._testGetVisibleRanges"
    waitAfter: 1000
