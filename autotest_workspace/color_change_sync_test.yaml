name: "Color change syncs without Go"
description: "Verify that changing a group color via syncConfig keeps results active and re-applies decorations"
plugin: "./.."
workspace: "."
timeout: 120000
steps:
  - description: "Open test log file with timestamps"
    command: "greplogviewer._testOpenFile"
    args:
      - "./test_timeline.log"
    waitAfter: 2000

  - description: "Focus editor and wait for activation"
    command: "workbench.action.focusActiveEditorGroup"
    waitAfter: 2000

  - description: "Prime extension activation"
    command: "greplogviewer._testGetState"
    waitAfter: 1500

  - description: "Apply filter A with red color + keyword + time pattern"
    command: "greplogviewer._testGo"
    args:
      - groups:
          - id: "group-a"
            name: "Group A"
            color: "#ff0000"
            expressions:
              - id: "expr-a"
                pattern: "match A"
                flags: ""
                operator: "and"
        timePattern:
          format: "YYYY-MM-DD HH:mm:ss.SSS"
        keywords:
          - id: "kw-a"
            pattern: "match A"
            color: "#ff0000"
            flags: ""
            matchScope: "matched"
            enabled: true
    waitAfter: 2500

  - description: "Verify filter A produced matches"
    command: "greplogviewer._testGetState"
    assert:
      type: "return_value_contains"
      expected: '"startLine":1'
    waitAfter: 1000

  - description: "Verify timeline keyword color is red"
    command: "greplogviewer._testGetTimelineData"
    assert:
      type: "return_value_contains"
      expected: '"color":"#ff0000"'
    waitAfter: 1000

  - description: "Sync config with green keyword color only (no Go)"
    command: "greplogviewer._testSyncConfig"
    args:
      - groups:
          - id: "group-a"
            name: "Group A"
            color: "#ff0000"
            expressions:
              - id: "expr-a"
                pattern: "match A"
                flags: ""
                operator: "and"
        keywords:
          - id: "kw-a"
            pattern: "match A"
            color: "#00ff00"
            flags: ""
            matchScope: "matched"
            enabled: true
    waitAfter: 1000

  - description: "Verify results remain active after color-only sync"
    command: "greplogviewer._testGetState"
    assert:
      type: "return_value_contains"
      expected: '"startLine":1'
    waitAfter: 1000

  - description: "Verify timeline keyword color updated to green"
    command: "greplogviewer._testGetTimelineData"
    assert:
      type: "return_value_contains"
      expected: '"color":"#00ff00"'
    waitAfter: 1000
